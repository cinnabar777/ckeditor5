<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CKE5</title>
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --toolbar-bg: #121212;
      --border-color: #222222;
      --button-hover: #1f1f1f;
      --body-font-size: 16px;
      --heading-scale: 1.0;
      --bold-color: inherit;
      --italic-color: inherit;
    }

    body.light-theme {
      --bg-color: #ffffff;
      --text-color: #111111;
      --toolbar-bg: #f8f9fa;
      --border-color: #e0e0e0;
      --button-hover: #e9ecef;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    #editor-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      box-sizing: border-box;
      position: relative;
    }

    /* Main Editor Area */
    .ck-editor {
      display: flex;
      flex-direction: column-reverse; /* Reverses order so toolbar is at bottom */
      height: 100% !important;
      width: 100% !important;
      border: none !important;
      box-shadow: none !important;
    }

    .ck-editor__top {
      background: var(--toolbar-bg) !important;
      border: none !important;
      border-top: 1px solid var(--border-color) !important;
      transition: max-height 0.2s ease, opacity 0.2s ease;
      z-index: 100;
    }

    .ck-editor__top.toolbar-collapsed {
      display: none !important;
    }

    .ck-toolbar {
      background: var(--toolbar-bg) !important;
      border: none !important;
      padding: 4px !important;
    }

    .ck-toolbar .ck-button,
    .ck-toolbar .ck-dropdown__button {
      color: var(--text-color) !important;
    }

    .ck-editor__main {
      flex: 1;
      overflow-y: auto;
      height: 100% !important;
      background-color: var(--bg-color) !important;
    }

    .ck-content {
      min-height: 100% !important;
      padding: 8px !important; /* Compact side padding */
      box-sizing: border-box;
      font-size: var(--body-font-size) !important;
      line-height: 1.6;
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
    }

    /* Relative Heading Scalings */
    .ck-content h1 { font-size: calc(2.0em * var(--heading-scale)) !important; }
    .ck-content h2 { font-size: calc(1.6em * var(--heading-scale)) !important; }
    .ck-content h3 { font-size: calc(1.3em * var(--heading-scale)) !important; }
    .ck-content h4 { font-size: calc(1.1em * var(--heading-scale)) !important; }
    .ck-content h5 { font-size: calc(1.0em * var(--heading-scale)) !important; }
    .ck-content h6 { font-size: calc(0.9em * var(--heading-scale)) !important; }

    /* Custom Bold / Italic Colors */
    .ck-content strong, .ck-content b {
      color: var(--bold-color) !important;
    }
    .ck-content em, .ck-content i {
      color: var(--italic-color) !important;
    }

    /* Dark Mode CKEditor Specific Adjustments */
    body:not(.light-theme) .ck.ck-reset_all,
    body:not(.light-theme) .ck.ck-reset_all * {
      color: #ffffff !important;
    }

    body:not(.light-theme) .ck-dropdown__panel,
    body:not(.light-theme) .ck-list,
    body:not(.light-theme) .ck-balloon-panel {
      background: #181818 !important;
      border-color: #333333 !important;
    }

    /* Web App Bar inside Bottom Toolbar */
    #bottom-app-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--toolbar-bg);
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-color);
    }

    #file-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 6px;
    }

    .action-btn-group {
      display: flex;
      gap: 4px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .action-btn:active {
      background-color: var(--button-hover);
    }

    /* Floating Toolbar Toggle Button */
    #fab-toolbar-toggle {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 22px;
      background-color: #0288D1;
      color: #ffffff;
      border: none;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      z-index: 200;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="./bundle.css">
</head>
<body>
  <div id="editor-container">
    <div id="editor"></div>
    <button id="fab-toolbar-toggle" title="Toggle Toolbar">⟨</button>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
